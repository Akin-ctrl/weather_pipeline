
services:
  database:
    image: postgres:16-alpine
    container_name: weather_db
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_NAME}
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
      - postgres_data:/var/lib/postgresql/data/
    ports:
      - "5432:5432" 
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5


  loader:
    build:
      context: .
      dockerfile: Dockerfile_pipeline
    container_name: load_database
    depends_on:
      database:
        condition: service_healthy # Waits for the DB to be fully ready
    environment:
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
      - DB_HOST=database
    command: ["python", "load_database.py"]

  
  pipeline:
    build:
      context: .
      dockerfile: Dockerfile_pipeline
    container_name: weather_pipeline
    depends_on:
      loader:
        condition: service_completed_successfully
    environment:
      - OPENWEATHER_API_KEY=${OPENWEATHER_API_KEY}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
      - DB_HOST=database 

  pgadmin:
    image: dpage/pgadmin4
    container_name: weather_pgadmin
    environment:
      - PGADMIN_DEFAULT_EMAIL=${PGADMIN_DEFAULT_EMAIL}
      - PGADMIN_DEFAULT_PASSWORD=${PGADMIN_DEFAULT_PASSWORD}
    ports:
      - "5050:80"
    
    depends_on:
      - database
  

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile_pipeline
    image: dashboard
    container_name: weather_dashboard
    depends_on:
      - database
    ports:
      - "8501:8501"
    environment:
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
      - DB_HOST=database
    volumes:
      - ./:/app
    command: ["streamlit", "run", "dashboard.py", "--server.port=8501", "--server.address=0.0.0.0"]

volumes:
  postgres_data:
